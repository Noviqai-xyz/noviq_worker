# Seed fleet + a local Ollama, so the network always has online capacity.
# Usage:
#   cp .env.example .env   # set ADMIN_SECRET (or NURO_WORKER_TOKENS) + ORCHESTRATOR_WS_URL
#   docker compose up -d --build
# For GPU: install the NVIDIA Container Toolkit and uncomment the `deploy` block.

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  fleet:
    build: .
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      ORCHESTRATOR_WS_URL: ${ORCHESTRATOR_WS_URL:-wss://orchestrator.nuroai.xyz/v1/worker}
      ORCHESTRATOR_HTTP_URL: ${ORCHESTRATOR_HTTP_URL:-}
      OLLAMA_HOST: http://ollama:11434
      AUTO_PULL: ${AUTO_PULL:-1}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      NURO_WORKER_TOKENS: ${NURO_WORKER_TOKENS:-}
    volumes:
      - fleet-tokens:/data

volumes:
  ollama-models:
  fleet-tokens:
